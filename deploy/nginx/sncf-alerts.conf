# SNCF-Alerts — reverse-proxy HTTPS (Let's Encrypt)
#
# Prérequis : remplacer SERVER_NAME, activer le site, puis :
#   sudo certbot --nginx -d VOTRE_DOMAINE
#
# Vite doit tourner en HTTP local :
#   WEB_BEHIND_PROXY=true
#   WEB_HOST=127.0.0.1
#   WEB_PORT=5173

upstream sncf_alerts_web {
    server 127.0.0.1:5173;
    keepalive 8;
}

upstream sncf_alerts_api {
    server 127.0.0.1:3001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # ACME HTTP-01 (certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SERVER_NAME;

    # Remplacés / complétés par certbot --nginx (chemins typiques) :
    # ssl_certificate     /etc/letsencrypt/live/SERVER_NAME/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Placeholder tant que certbot n’a pas tourné (éviter nginx -t KO) :
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 1m;

    location /v1/ {
        proxy_pass http://sncf_alerts_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location / {
        proxy_pass http://sncf_alerts_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# SNCF-Alerts — reverse-proxy HTTPS (Let's Encrypt)
#
# Le client web est servi en **statique** depuis le build Vite : aucun serveur de
# développement en production. Régénérer après chaque déploiement :
#   npm run build -w @sncf-alerts/web   →   apps/web/dist
#
# Prérequis : remplacer SERVER_NAME et WEB_ROOT, activer le site, puis :
#   sudo certbot --nginx -d VOTRE_DOMAINE

upstream sncf_alerts_api {
    server 127.0.0.1:3001;
    keepalive 8;
}

# Brute force login : 5 tentatives/minute soutenues, rafale courte tolérée (humain qui
# se trompe). Première barrière avant le rate-limit applicatif (par IP + identifiant).
limit_req_zone $binary_remote_addr zone=sncf_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=sncf_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=sncf_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # ACME HTTP-01 (certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SERVER_NAME;

    # Build statique du client (npm run build -w @sncf-alerts/web)
    root WEB_ROOT;
    index index.html;

    # Remplacés / complétés par certbot --nginx (chemins typiques) :
    # ssl_certificate     /etc/letsencrypt/live/SERVER_NAME/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Placeholder tant que certbot n’a pas tourné (éviter nginx -t KO) :
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # ⚠️  Un `add_header` dans un `location` annule TOUS les `add_header` hérités du
    # `server`. Les blocs ci-dessous n’utilisent donc que `expires` pour le cache.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # `script-src 'self'` : possible depuis le passage au build statique (plus de HMR,
    # plus de <script> inline — l’amorçage thème vit dans /theme-boot.js).
    # `style-src-attr 'unsafe-inline'` reste nécessaire : largeurs dynamiques du quota.
    # `style-src` garde 'unsafe-inline' comme repli pour les navigateurs sans CSP3.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    client_max_body_size 1m;
    limit_conn sncf_conn 32;

    location = /v1/admin/login {
        limit_req zone=sncf_login burst=5 nodelay;
        proxy_pass http://sncf_alerts_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        limit_req zone=sncf_api burst=40 nodelay;
        proxy_pass http://sncf_alerts_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets fingerprintés par Vite : immuables, cache long.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # HashRouter : toutes les routes vivent après le `#`, index.html suffit.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
